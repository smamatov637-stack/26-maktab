<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Sahifa topilmadi | Marg'ilon 26-son Maktab</title>
  <link rel="icon" type="image/svg+xml" href="./assets/img/emblem.svg" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8fafc;
      color: #0f172a;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #090e1a; color: #f1f5f9; }
      .card { background: #111827 !important; border-color: #1e2d45 !important; }
      p { color: #94a3b8 !important; }
    }
    .card {
      max-width: 460px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
    }
    .code {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #1e40af, #0d9488);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; margin-bottom: 10px; }
    p { font-size: 14.5px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      background: #1e40af;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
    }
    a:hover { background: #1d4ed8; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Sahifa topilmadi</h1>
    <p>Siz qidirayotgan manzil mavjud emas yoki boshqa manzilga ko'chirilgan. Marg'ilon shahri 26-son maktabning bosh sahifasiga qayting.</p>
    <a href="./">← Bosh sahifaga qaytish</a>
  </div>
</body>
</html>
