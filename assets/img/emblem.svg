<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Marg'ilon 26-maktab emblemasi">
  <defs>
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Rounded shield base -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#crestBg)"/>
  <rect x="11" y="11" width="98" height="98" rx="22" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="1.5"/>
  <!-- Subtle Uzbek 8-point star ornament -->
  <g opacity="0.14" stroke="#ffffff" stroke-width="1.2" fill="none">
    <rect x="30" y="30" width="60" height="60" rx="4"/>
    <rect x="30" y="30" width="60" height="60" rx="4" transform="rotate(45 60 60)"/>
  </g>
  <!-- Golden star / rays above book -->
  <polygon points="60,19 63.2,26.4 71.2,27.1 65.1,32.3 67,40.1 60,35.9 53,40.1 54.9,32.3 48.8,27.1 56.8,26.4" fill="url(#goldGrad)"/>
  <!-- Number 26 -->
  <text x="60" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#ffffff" letter-spacing="1">26</text>
  <!-- Open book motif -->
  <path d="M28 76 C38 72, 50 74, 60 80 C70 74, 82 72, 92 76 L92 91 C82 87, 70 89, 60 95 C50 89, 38 87, 28 91 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <line x1="60" y1="80" x2="60" y2="95" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M33 96 C43 92.5, 51 94, 60 99 C69 94, 77 92.5, 87 96" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
